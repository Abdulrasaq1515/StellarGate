openapi: 3.1.0
info:
  title: StellarGate
  description: Payment gateway API built on Stellar for accepting and managing payments in XLM and USDC.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /payments:
    post:
      operationId: createPayment
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment intent created
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_amount:
                  summary: Invalid amount
                  value:
                    error: amount must be a positive number with at most 7 decimal places
                    code: invalid_amount
                unsupported_asset:
                  summary: Unsupported asset
                  value:
                    error: "unsupported asset 'EURC'; supported: XLM, USDC"
                    code: unsupported_asset
                unknown_field:
                  summary: Unrecognized field in the request body
                  value:
                    error: >-
                      invalid request body: Failed to deserialize the JSON body
                      into the target type: unknown field `merchant_id`,
                      expected one of `amount`, `asset`, `webhook_url`
                    code: unknown_field
        "429":
          description: >-
            Rate limit exceeded. The request fell into the `payments` bucket,
            whose quota is RATE_LIMIT_REQUESTS_PER_SEC × 1. See the Rate
            Limiting section of the README for the full bucket/quota model.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rate_limit_exceeded:
                  summary: Rate limit exceeded
                  value:
                    error: rate limit exceeded
                    code: rate_limit_exceeded

    get:
      operationId: listPayments
      summary: List payments
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip (offset pagination)
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor for keyset pagination (returned as next_cursor)
      responses:
        "200":
          description: Paginated list of payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPaymentsResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPayment
      summary: Get a payment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}/webhooks:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook deliveries for a payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Webhook delivery history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebhookDeliveriesResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}/webhooks/{delivery_id}/redeliver:
    post:
      operationId: redeliverWebhook
      summary: Re-attempt a webhook delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Redelivery succeeded
        "404":
          description: Payment or delivery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                delivery_not_found:
                  summary: Delivery not found
                  value:
                    error: delivery not found
                    code: delivery_not_found
        "502":
          description: Webhook endpoint returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                webhook_delivery_failed:
                  summary: Redelivery failed
                  value:
                    error: webhook delivery failed
                    code: webhook_delivery_failed

components:
  # Every response from every operation carries the X-RateLimit-* family, so a
  # client can pace itself before being throttled rather than discovering the
  # limit by hitting it. They are declared once here and referenced where they
  # matter most; a 429 additionally carries Retry-After.
  #
  # All four are listed in Access-Control-Expose-Headers, without which a
  # browser client could see the 429 but none of the headers explaining it.
  headers:
    RetryAfter:
      description: >-
        Delta-seconds until a single further request would be permitted,
        derived from the limiter's own state. Note that quotas are per-second,
        so one cell replenishes in under a second and this integer value
        (RFC 9110) currently reports 1 at every configured rate — use
        X-RateLimit-Remaining for pacing.
      schema:
        type: integer
        minimum: 1
        example: 1
    XRateLimitLimit:
      description: >-
        The bucket's effective quota, with the per-bucket multiplier already
        applied (read-only routes get 5x the configured base rate).
      schema:
        type: integer
        example: 50
    XRateLimitRemaining:
      description: Requests still available in this bucket right now.
      schema:
        type: integer
        minimum: 0
        example: 49
    XRateLimitReset:
      description: >-
        Delta-seconds until the bucket is back to full capacity. Always >=
        Retry-After, which covers only the next single request. A delta rather
        than an epoch timestamp, so a client with a skewed clock still gets a
        usable answer.
      schema:
        type: integer
        minimum: 0
        example: 1

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    PaymentStatus:
      type: string
      enum: [pending, completed, underpaid, expired]

    Payment:
      type: object
      required:
        - id
        - merchant_id
        - destination_address
        - memo
        - amount
        - asset
        - status
        - created_at
        - updated_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          example: my-shop
        destination_address:
          type: string
          description: Stellar public key the user must pay to
          example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        memo:
          type: string
          description: 8-character memo the user must include in their transaction
          example: A1B2C3D4
        amount:
          type: string
          description: Requested amount as a decimal string
          example: "10.00"
        asset:
          type: string
          enum: [XLM, USDC]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        tx_hash:
          type: string
          nullable: true
          description: On-chain transaction hash once settled
        paid_amount:
          type: string
          nullable: true
          description: Cumulative amount received
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    CreatePaymentRequest:
      type: object
      required: [amount]
      # The server rejects any field not listed here with 400 unknown_field.
      # `merchant_id` used to be documented but was never read — the merchant is
      # taken from the API key — so sending it now fails loudly instead of
      # silently binding the intent to whichever merchant owns the key.
      additionalProperties: false
      properties:
        amount:
          type: string
          description: Positive decimal, up to 7 decimal places
          example: "10.00"
        asset:
          type: string
          enum: [XLM, USDC]
          default: XLM
          description: >-
            Defaults to XLM when omitted. Because the default applies silently,
            a misspelled field name (e.g. `assset`) would otherwise create an
            XLM intent; it is rejected as unknown_field instead.
        webhook_url:
          type: string
          format: uri
          description: Webhook endpoint URL. Must be HTTPS in production.
          example: https://yourapp.com/webhooks/stellar

    ListPaymentsResponse:
      type: object
      required: [payments, limit]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
          description: Total matching rows (offset pagination only)
        limit:
          type: integer
        offset:
          type: integer
          description: Present when using offset pagination
        next_cursor:
          type: string
          nullable: true
          description: Pass as cursor on the next request to get the following page

    WebhookDelivery:
      type: object
      required: [id, url, event, status, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        event:
          type: string
          description: >-
            The event this delivery carries. Redelivery reuses it as the
            X-StellarGate-Event header, so it always matches the payload.
          example: payment.underpaid
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:
          type: integer
        last_attempt:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ListWebhookDeliveriesResponse:
      type: object
      required: [payment_id, deliveries]
      properties:
        payment_id:
          type: string
          format: uuid
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"

    ErrorResponse:
      type: object
      description: Standard error envelope for public API failures.
      required: [error, code]
      example:
        error: The provided amount is invalid
        code: invalid_amount
      properties:
        error:
          type: string
          description: Human-readable explanation of the failure.
          example: The provided amount is invalid
        code:
          type: string
          description: >-
            Stable machine-readable error code for programmatic handling. Public
            values currently include unauthorized, internal_error,
            invalid_request, unknown_field, unsupported_asset, invalid_amount,
            invalid_webhook_url, invalid_status, invalid_cursor,
            payment_not_found, delivery_not_found, rate_limit_exceeded,
            not_found, webhook_target_blocked, webhook_delivery_failed, and
            idempotency_conflict.
          example: invalid_amount
