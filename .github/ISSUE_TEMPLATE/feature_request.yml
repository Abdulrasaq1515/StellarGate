name: Feature request
description: Propose a capability StellarGate does not have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that you cannot do today? Describe the
        situation rather than a specific solution — it often has more than one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether the existing API can already be composed to do this.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This would change an existing API response shape or error code
        - label: This would require a database migration
        - label: I am willing to open a PR for this
